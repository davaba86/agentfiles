repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types:
          - go

      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        types:
          - go
        pass_filenames: false
        always_run: true

      - id: go-test
        name: go test
        entry: task test
        language: system
        pass_filenames: false
        always_run: true

      - id: go-build
        name: go build
        entry: task build
        language: system
        pass_filenames: false
        always_run: true
